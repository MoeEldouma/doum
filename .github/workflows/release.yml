name: release

# Push a tag like v0.1.0 to build Linux binaries for x86_64 and arm64 and attach them to a DRAFT release.
# Nothing is published until you open the draft on GitHub and press "Publish release".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "doum $TAG" --notes "See CHANGELOG.md."

  build:
    needs: draft
    name: build (${{ matrix.arch }})
    # 22.04 runners: glibc 2.35, so the binary also runs on older distros than the one it was built on
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x86_64 }
          - { os: ubuntu-22.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: test
        run: cargo test --all --locked
      - name: build
        run: cargo build --release --locked
      - name: package
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="doum-${TAG}-${ARCH}-linux"
          mkdir -p "dist/$name"
          cp target/release/doum LICENSE README.md "dist/$name/"
          cp -r deploy integrations claude docs "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY"
