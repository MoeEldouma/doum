[package]
name = "doum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Share one GPU between ComfyUI, local LLMs, training and AI agents: a smart queue with memory shards, wait-or-pause and MCP tools."

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
humantime = "2.4.0"
nix = { version = "0.31.3", features = ["signal", "process"] }
notify-rust = "4.18.2"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "blocking"] }
rmcp = { version = "3.6.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
