<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doum · GPU queue</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1110; --panel: #151b19; --line: #25302c; --ink: #e8efe9; --soft: #a9b8b0; --muted: #6f807a;
    --palm: #6fcf8e; --sand: #e7c27d; --red: #ff7d6b; --blue: #7cc4f0;
    --f: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f); padding: 18px clamp(12px, 3vw, 32px) 40px; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: .3px; }
  .brand small { font: 500 12px var(--mono); color: var(--muted); letter-spacing: 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font: 12px var(--mono); color: var(--soft); background: var(--panel); }
  .chip b { color: var(--ink); font-weight: 600; }
  .warn { color: var(--sand); } .hot { color: var(--red); }
  .bar { display: flex; height: 30px; border-radius: 9px; overflow: hidden; background: #0a0e0d; border: 1px solid var(--line); margin-bottom: 6px; position: relative; }
  .bar span { display: flex; align-items: center; justify-content: center; font: 600 11px var(--mono); color: #0d1110; white-space: nowrap; overflow: hidden;
    width: 0; transition: width .9s cubic-bezier(.2,.8,.2,1), opacity .5s; box-shadow: inset -1px 0 0 #0d1110; }
  .bar span.pausing { background-image: repeating-linear-gradient(-45deg, rgba(13,17,16,.35) 0 6px, transparent 6px 12px) !important;
    background-size: 17px 17px; animation: slide 0.8s linear infinite; }
  .bar .want { position: absolute; top: 2px; bottom: 2px; right: 2px; border: 1.5px dashed var(--blue); border-radius: 7px; color: var(--blue);
    font: 11px var(--mono); display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; background: transparent; box-shadow: none;
    transition: width .9s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
  @keyframes slide { to { background-position: 17px 0; } }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .dot.live { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(111,207,142,.55); } 50% { box-shadow: 0 0 0 5px rgba(111,207,142,0); } }
  .prog { grid-column: 1 / -1; height: 4px; background: #0a0e0d; border-radius: 3px; overflow: hidden; }
  .prog i { display: block; height: 100%; transition: width 1.8s linear; }
  .job.enter { animation: enter .6s cubic-bezier(.2,.8,.2,1); }
  @keyframes enter { from { opacity: 0; transform: translateY(-8px); } }
  .tl { position: relative; height: var(--h, 60px); background: #0a0e0d; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tl .seg { position: absolute; height: 18px; border-radius: 5px; font: 600 10.5px var(--mono); color: #0d1110; padding: 0 6px; line-height: 18px;
    white-space: nowrap; overflow: hidden; transition: left .9s linear, width .9s linear, top .4s; }
  .tl .seg.paused-gap { background: transparent !important; border: 1px dashed; opacity: .55; }
  .tl .now { position: absolute; top: 0; bottom: 0; right: 0; width: 2px; background: var(--palm); box-shadow: 0 0 8px var(--palm); }
  .tl .tick { position: absolute; bottom: 2px; font: 10px var(--mono); color: var(--muted); transform: translateX(-50%); }
  .tl .gl { position: absolute; top: 0; bottom: 14px; width: 1px; background: #18201d; }
  .wide { margin-bottom: 16px; }
  .barcap { font: 12px var(--mono); color: var(--muted); margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
  .col { display: grid; gap: 16px; align-content: start; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--soft); }
  .empty { color: var(--muted); font-style: italic; }
  .job { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .job:first-of-type { border-top: 0; }
  .job .name { font-weight: 650; }
  .job .meta { font: 12px var(--mono); color: var(--muted); }
  .job .msg { color: var(--soft); font-size: 13px; }
  .lane { font: 11px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--soft); margin-left: 6px; }
  .lane.interactive { color: var(--blue); border-color: #2c4b5e; }
  .acts { display: flex; gap: 6px; align-items: start; }
  button { font: 600 12px var(--f); color: var(--ink); background: #1e2724; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--palm); }
  button.rec { background: var(--palm); color: #0d1110; border-color: var(--palm); }
  button.danger:hover { border-color: var(--red); color: var(--red); }
  .q { border: 1px solid #5b4a26; background: #1d1910; border-radius: 10px; padding: 12px; margin-top: 8px; }
  .q p { margin: 0 0 10px; white-space: pre-line; }
  .q .acts { flex-wrap: wrap; }
  .q .dl { font: 12px var(--mono); color: var(--sand); margin-left: auto; align-self: center; }
  .chart { margin-top: 6px; }
  .chart .lbl { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); margin-bottom: 4px; }
  .chart svg { width: 100%; height: 84px; display: block; background: #0a0e0d; border-radius: 6px; border: 1px solid var(--line); }
  .note { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #2a1715; border: 1px solid #6b2f28; color: #ffd2cb; padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; }
  .fin { font: 12px var(--mono); color: var(--soft); display: grid; grid-template-columns: 3.5em 1fr auto auto; gap: 4px 10px; }
  .fin .done { color: var(--palm); } .fin .failed { color: var(--red); } .fin .cancelled { color: var(--muted); }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 30V14" stroke="#c9a46a" stroke-width="2.4" stroke-linecap="round"/><path d="M16 14C12 9 6 9 3 12M16 14c4-5 10-5 13-2M16 14c-2-6-7-9-11-8M16 14c2-6 7-9 11-8M16 14c0-6 0-9 0-11" stroke="#6fcf8e" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
    Doum <small>one GPU, shade for every job</small>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div class="bar" id="bar"></div>
<div class="barcap" id="barcap"></div>

<section class="wide"><h2>Timeline <small style="text-transform:none;letter-spacing:0;color:var(--muted);font:12px var(--mono)">· jobs side by side, pauses as dashed gaps</small></h2><div class="tl" id="tl"></div></section>

<div class="grid">
  <div class="col">
    <section><h2>Questions for you</h2><div id="questions"></div></section>
    <section><h2>Running</h2><div id="running"></div></section>
    <section><h2>Waiting (start order)</h2><div id="waiting"></div></section>
  </div>
  <div class="col">
    <section><h2>Last hour</h2><div id="charts"></div></section>
    <section><h2>Outside the queue</h2><div id="outside"></div></section>
    <section><h2>Finished</h2><div id="finished"></div></section>
  </div>
</div>
<div class="note" id="note"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const dur = (s) => s == null ? "" : s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.floor(s / 3600)}h${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}`;
const energy = (j) => j < 180 ? "" : j < 3.6e6 ? `${(j / 3600).toFixed(1)} Wh` : `${(j / 3.6e6).toFixed(2)} kWh`;
const COLORS = ["#6fcf8e", "#7cc4f0", "#e7c27d", "#c99cf0", "#f09c7c", "#9ce0d6"];
const label = { smart: "Smart", wait: "Wait", pause: "Pause now", "pause-now": "Pause now", "keep-waiting": "Keep waiting", cancel: "Cancel" };

function note(msg) { const n = $("note"); n.textContent = msg; n.style.display = "block"; clearTimeout(note.t); note.t = setTimeout(() => n.style.display = "none", 6000); }

async function act(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}), credentials: "same-origin" });
  if (r.status === 401) { note("Controls are locked: open the panel with `doum panel` once to unlock them."); return; }
  if (!r.ok) { const e = await r.json().catch(() => ({})); note(e.error || `failed (${r.status})`); return; }
  load();
}
window.act = act;

const color = (id) => COLORS[id % COLORS.length];
const seen = new Set();

function jobRow(j, now, kind) {
  const eta = j.progress && j.progress.eta_s != null ? Math.max(0, j.progress.eta_s - (now - j.progress.updated_at)) : null;
  const ran = j.started_at ? dur(now - j.started_at) : "";
  const lane = `<span class="lane ${j.lane}">${j.lane}</span>`;
  const meta = kind === "run"
    ? `#${j.id} · ${j.shards} shards · ${ran}${eta != null ? ` · ~${dur(eta)} left` : ""}${energy(j.energy_j) ? ` · ${energy(j.energy_j)}` : ""}${j.state === "pausing" ? " · <span class=warn>pausing</span>" : ""}`
    : `#${j.id} · ${j.shards} shards · ${esc(j.reason)}`;
  const acts = kind === "run"
    ? `${j.detached && !j.no_pause ? `<button onclick="act('/api/jobs/${j.id}/pause')">Pause</button>` : ""}<button class="danger" onclick="if(confirm('Cancel ${esc(j.name)}?'))act('/api/jobs/${j.id}/cancel')">Cancel</button>`
    : `<button onclick="act('/api/jobs/${j.id}/top')">Move up</button><button class="danger" onclick="act('/api/jobs/${j.id}/cancel')">Cancel</button>`;
  const isNew = !seen.has(`${kind}${j.id}`); seen.add(`${kind}${j.id}`);
  const el = j.started_at ? now - j.started_at : 0;
  const prog = kind === "run" && eta != null ? `<div class="prog"><i style="width:${Math.min(100, (100 * el) / Math.max(1, el + eta)).toFixed(1)}%;background:${color(j.id)}"></i></div>` : "";
  const dot = kind === "run" ? `<span class="dot ${j.state === "running" ? "live" : ""}" style="background:${j.state === "pausing" ? "var(--sand)" : color(j.id)}"></span>` : "";
  return `<div class="job${isNew ? " enter" : ""}"><div>${dot}<span class="name">${esc(j.name)}</span>${lane}<div class="meta">${meta}</div>${j.progress && j.progress.message ? `<div class="msg">${esc(j.progress.message)}</div>` : ""}</div><div class="acts">${acts}</div>${prog}</div>`;
}

// the shard bar: one segment per running job, kept between refreshes so widths animate instead of jumping
function renderBar(running, s) {
  const bar = $("bar"), keep = new Set();
  for (const j of running) {
    keep.add(String(j.id));
    let el = bar.querySelector(`span[data-id="${j.id}"]`);
    if (!el) {
      el = document.createElement("span"); el.dataset.id = j.id; el.style.background = color(j.id);
      bar.insertBefore(el, bar.querySelector(".want")); requestAnimationFrame(() => requestAnimationFrame(() => el.style.width = `${(100 * j.shards) / s.total_shards}%`));
    } else el.style.width = `${(100 * j.shards) / s.total_shards}%`;
    el.textContent = j.shards >= 10 ? j.name : "";
    el.title = `${j.name} · ${j.shards} shards`;
    el.classList.toggle("pausing", j.state === "pausing");
  }
  for (const el of [...bar.querySelectorAll("span[data-id]")]) if (!keep.has(el.dataset.id)) { el.style.width = "0"; el.style.opacity = "0"; el.removeAttribute("data-id"); setTimeout(() => el.remove(), 900); }
  // the job at the front of the queue: a dashed outline of what it is waiting for
  const head = s.queue.length ? s.jobs.find((j) => j.id === s.queue[0]) : null;
  let want = bar.querySelector(".want");
  const free = s.total_shards - s.used_shards;
  if (head && free > 0) {
    if (!want) { want = document.createElement("span"); want.className = "want"; bar.appendChild(want); }
    want.style.width = `calc(${(100 * free) / s.total_shards}% - 4px)`;
    want.textContent = free >= 12 ? `${head.name} needs ${head.shards}` : "";
  } else if (want) want.remove();
}

// timeline: every run of every job in the window, packed onto as few tracks as possible
function renderTimeline(s) {
  const now = s.now, span = (j) => [...(j.runs || []), ...(j.started_at ? [[j.started_at, j.ended_at || now]] : [])];
  const jobs = s.jobs.map((j) => ({ j, segs: span(j) })).filter((x) => x.segs.length);
  const first = Math.min(...jobs.map((x) => x.segs[0][0]), now - 120);
  const t0 = Math.max(first - 5, now - 15 * 60), W = Math.max(60, now - t0);
  const live = jobs.filter((x) => x.segs[x.segs.length - 1][1] > t0).sort((a, b) => a.segs[0][0] - b.segs[0][0]);
  const ends = [];
  const x = (t) => (100 * (Math.max(t, t0) - t0)) / W;
  let html = "";
  for (let k = 1; k < 6; k++) { const t = t0 + (W * k) / 6; const ago = Math.round(now - t); html += `<div class="gl" style="left:${(100 * k) / 6}%"></div><span class="tick" style="left:${(100 * k) / 6}%">-${ago < 180 ? `${ago}s` : dur(ago)}</span>`; }
  for (const { j, segs } of live) {
    let tr = ends.findIndex((e) => e <= segs[0][0]); if (tr < 0) { tr = ends.length; ends.push(0); }
    ends[tr] = segs[segs.length - 1][1] + 2;
    const top = 6 + tr * 24, c = color(j.id);
    segs.forEach(([a, b], i) => {
      html += `<div class="seg" style="top:${top}px;left:${x(a)}%;width:${Math.max(0.6, x(b) - x(a))}%;background:${c}" title="${esc(j.name)}">${i === 0 || segs.length > 1 ? esc(j.name) : ""}</div>`;
      if (i + 1 < segs.length) html += `<div class="seg paused-gap" style="top:${top}px;left:${x(b)}%;width:${Math.max(0.6, x(segs[i + 1][0]) - x(b))}%;border-color:${c};color:${c}">paused</div>`;
    });
  }
  const tl = $("tl"); tl.style.setProperty("--h", `${Math.max(60, 26 + ends.length * 24)}px`);
  tl.innerHTML = html + `<div class="now"></div>` || `<div class="empty">nothing has run yet</div>`;
}

function render(s) {
  const now = s.now, jobs = s.jobs, L = s.latest || {};
  const free = s.total_shards - s.used_shards;
  const chips = [
    `<span class="chip"><b>${s.used_shards}</b>/${s.total_shards} shards</span>`,
    `<span class="chip"><b>${s.mem_available_gb.toFixed(0)}</b> GB free</span>`,
  ];
  if (L.gpu_c != null) chips.push(`<span class="chip ${L.gpu_c >= 80 ? "hot" : ""}">GPU <b>${L.gpu_c}</b>°C · ${L.gpu_w ?? "?"} W</span>`);
  if (L.soc_c != null) chips.push(`<span class="chip ${L.soc_c >= 85 ? "hot" : L.soc_c >= 75 ? "warn" : ""}">SoC <b>${L.soc_c}</b>°C</span>`);
  $("chips").innerHTML = chips.join("");

  const running = jobs.filter((j) => j.state === "running" || j.state === "pausing").sort((a, b) => a.started_at - b.started_at);
  renderBar(running, s);
  renderTimeline(s);
  $("barcap").textContent = `${free} shards free · ${running.length} running · ${s.queue.length} waiting`;

  $("running").innerHTML = running.map((j) => jobRow(j, now, "run")).join("") || `<div class="empty">nothing on the GPU</div>`;
  $("waiting").innerHTML = s.queue.map((id) => jobs.find((j) => j.id === id)).filter(Boolean).map((j) => jobRow(j, now, "wait")).join("") || `<div class="empty">queue empty</div>`;

  $("questions").innerHTML = s.decisions.map((d) => `<div class="q"><p>${esc(d.text)}</p><div class="acts">${d.options.map((o) => `<button class="${o === d.recommended ? "rec" : ""}" onclick="act('/api/decisions/${d.id}',{choice:'${o}'})">${label[o] || o}</button>`).join("")}<span class="dl">default ${label[d.recommended] || d.recommended} in ${dur(Math.max(0, d.deadline - now))}</span></div></div>`).join("") || `<div class="empty">none</div>`;

  $("outside").innerHTML = s.unmanaged.map((p) => `<div class="job"><div><span class="name">${esc(p.name)}</span><div class="meta">pid ${p.pid} · ~${p.mem_gb.toFixed(1)} GB · not waiting its turn</div></div></div>`).join("") || `<div class="empty">nothing</div>`;

  const fin = jobs.filter((j) => ["done", "failed", "cancelled"].includes(j.state)).sort((a, b) => (b.ended_at || 0) - (a.ended_at || 0)).slice(0, 12);
  $("finished").innerHTML = fin.length ? `<div class="fin">${fin.map((j) => `<span>#${j.id}</span><span>${esc(j.name)}</span><span class="${j.state}">${j.state}</span><span>${energy(j.energy_j)}</span>`).join("")}</div>` : `<div class="empty">none yet</div>`;
}

function line(points, key, color, lo, hi) {
  const pts = points.filter((p) => p[key] != null);
  if (pts.length < 2) return "";
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t || t0 + 1;
  const xy = pts.map((p) => `${((p.t - t0) / Math.max(1, t1 - t0)) * 600},${80 - ((p[key] - lo) / Math.max(1e-9, hi - lo)) * 76}`).join(" ");
  return `<polyline fill="none" stroke="${color}" stroke-width="1.8" points="${xy}"/>`;
}
function chart(title, pts, series, lo, hi) {
  const last = pts.length ? pts[pts.length - 1] : {};
  const legend = series.map(([k, c, n, u]) => `<span style="color:${c}">${n} ${last[k] ?? "–"}${u}</span>`).join(" · ");
  return `<div class="chart"><div class="lbl"><span>${title}</span><span>${legend}</span></div><svg viewBox="0 0 600 84" preserveAspectRatio="none">${series.map(([k, c]) => line(pts, k, c, lo, hi)).join("")}</svg></div>`;
}
function renderCharts(pts, total) {
  $("charts").innerHTML = pts.length < 2 ? `<div class="empty">collecting (one sample every 10 s)…</div>` :
    chart("GPU shards used", pts, [["used_shards", "#6fcf8e", "used", ""]], 0, total) +
    chart("memory free (GB)", pts, [["mem_free_gb", "#7cc4f0", "free", " GB"]], 0, 128) +
    chart("temperature (°C)", pts, [["gpu_c", "#e7c27d", "GPU", "°"], ["soc_c", "#ff7d6b", "SoC", "°"]], 30, 105) +
    chart("GPU power (W)", pts, [["gpu_w", "#c99cf0", "power", " W"]], 0, 120);
}

let total = 110;
async function load() {
  try {
    const s = await (await fetch("/api/status", { cache: "no-store" })).json();
    total = s.total_shards; render(s);
  } catch (e) { $("barcap").textContent = "doum daemon not reachable"; }
}
async function loadCharts() {
  try { renderCharts(await (await fetch("/api/metrics?minutes=60", { cache: "no-store" })).json(), total); } catch (e) {}
}
load(); loadCharts();
setInterval(load, 2000); setInterval(loadCharts, 10000);
</script>
</body>
</html>
