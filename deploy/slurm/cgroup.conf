# cgroup v2 is used for process tracking only (clean stop of a whole job). No CPU / RAM / device limits:
# the GPU memory budget is enforced by the shard count + gb10-guard's tripwires, not by cgroups.
CgroupPlugin=cgroup/v2
ConstrainCores=no
ConstrainDevices=no
ConstrainRAMSpace=no
ConstrainSwapSpace=no
