# One GB10 GPU. Jobs request memory "shards" (~1 GB each) instead of the whole GPU, so small jobs can share it
# and big jobs (the 120B writer asks for all 110) get it alone. Nobody requests gres/gpu directly.
NodeName=@HOST@ Name=gpu   File=/dev/nvidia0
NodeName=@HOST@ Name=shard Count=110 File=/dev/nvidia0
