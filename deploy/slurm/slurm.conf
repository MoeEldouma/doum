# Slurm for one machine (doum's optional `slurm` backend). @HOST@ is replaced by install.sh.
# Every GPU job on this box goes through this queue. GPU memory is shared via "shards": 110 shards ~= 110 GB of the
# 121 GB unified pool of a GB10 (the rest is left for the OS, desktop and services). Adjust for your GPU.
# The NodeName line below is rewritten by install.sh from `slurmd -C` so CPU/memory match the hardware exactly.

ClusterName=gb10
SlurmctldHost=@HOST@
SlurmUser=slurm
AuthType=auth/munge
CredType=cred/munge

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm/jobcomp.log

# Process tracking with cgroup v2: a cancelled or paused job always takes its whole process tree with it.
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup
MpiDefault=none
ReturnToService=2

# Scheduling: strict priority order. Nothing jumps ahead of a job that is waiting at the front of the queue,
# and the "interactive" partition (you, waiting at the screen) is always considered before "batch".
SchedulerType=sched/builtin
SchedulerParameters=enable_user_top
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
PriorityType=priority/basic

# Pausing is meant to be done by doum (scontrol requeue), so it can decide per job (wait / pause / smart).
# Batch jobs are requeueable; on a pause they get SIGTERM and KillWait seconds to save a checkpoint before SIGKILL.
PreemptType=preempt/none
JobRequeue=1
KillWait=90
UnkillableStepTimeout=180

GresTypes=gpu,shard
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none

SlurmctldTimeout=120
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=600
Waittime=0

NodeName=@HOST@ CPUs=20 RealMemory=118000 Gres=gpu:1,shard:110 State=UNKNOWN

# interactive: someone is waiting for the result (the writer, a quick test). Scheduled first. MaxTime keeps a
#              forgotten interactive job from holding the GPU forever.
# batch:       renders, training, benchmarks, generation queues. Default. Pausable (requeue).
PartitionName=interactive Nodes=@HOST@ PriorityTier=10 DefaultTime=02:00:00 MaxTime=08:00:00 State=UP
PartitionName=batch       Nodes=@HOST@ PriorityTier=1  Default=YES MaxTime=INFINITE State=UP
